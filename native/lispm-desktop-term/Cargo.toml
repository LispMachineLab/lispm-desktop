[package]
name = "lispm-desktop-term"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Terminals for lispm-desktop: emulated off Emacs's thread, drawn only when shown; and its watch pointer and glass windows on macOS"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The event loop's PTY keys in src/pty.rs were read from this version.
alacritty_terminal = "=0.26.0"
base64 = "0.22"
libc = "0.2"
polling = "3.8"
emacs = { version = "0.23.0", features = ["emacs-28"] }

[profile.release]
opt-level = 3
lto = "thin"

# AppKit and the run loop, for the watch on the pointer (src/cursor.rs) and
# the glass windows (src/glass.rs).
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSEvent", "NSWindow", "NSApplication", "NSResponder", "NSView"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray", "NSEnumerator", "NSString"] }
