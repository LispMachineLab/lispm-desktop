name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # LispM Desktop needs what lispm-agent and lispm-browser do.  Its
        # terminals' Rust module is not built here, and these Emacs builds
        # draw no SVG, so the tests needing either are skipped.
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # The browser the desktop draws, from its own repository.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-browser
          path: .deps/lispm-browser
      # The editor's agents, from lispm-agent.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          # Public project work views; test the declared Agent 0.15.0 API.
          ref: e1b87a9e08774a3ee501cbf2e2a4c3bf5f3217b5
          path: .deps/lispm-agent
      # LispM Kit, whose engine translates the desktop's words and the agent's.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-kit
          path: .deps/lispm-kit
      # Stickies, whose notes the desktop shows, from its own repository.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-stickies
          path: .deps/lispm-stickies
      # LispM UI, with which the desktop draws forms and asks.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-ui
          path: .deps/lispm-ui
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: >-
          make test
          LISPM_UI=.deps/lispm-ui
          LISPM_BROWSER=.deps/lispm-browser/lisp
          LISPM_AGENT=.deps/lispm-agent/lisp
          LISPM_KIT=.deps/lispm-kit
          LISPM_STICKIES=.deps/lispm-stickies

  terminal-module:
    name: Terminal module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: make native-test
