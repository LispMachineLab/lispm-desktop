name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # LispM Desktop needs what lispm-agent and lispm-browser do.  Its
        # terminals' Rust module is not built here, and these Emacs builds
        # draw no SVG, so the tests needing either are skipped.
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # The browser the desktop draws, from its own repository.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-browser
          path: .deps/lispm-browser
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: make test LISPM_BROWSER=.deps/lispm-browser/lisp

  terminal-module:
    name: Terminal module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: make native-test
