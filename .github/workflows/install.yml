name: install

# install.sh, run as a newcomer runs it, on Apple silicon and on Intel:
# LispM.app made of Emacs, and the packages installed; and on GNU/Linux,
# in a fresh Debian and Ubuntu: LispM's Emacs installed with apt, the
# packages, and the command and menu entry starting it.
on:
  push:
    branches: [main]
    paths:
      - install.sh
      - macos/**
      - linux/**
      - early-init.el
      - init.el
      - lisp/lispm-desktop-deps.el
      - lisp/lispm-desktop-early.el
      - lisp/lispm-desktop-native-comp.el
      - lisp/lispm-desktop-packages.el
      - .github/workflows/install.yml
  pull_request:
    paths:
      - install.sh
      - macos/**
      - linux/**
      - early-init.el
      - init.el
      - lisp/lispm-desktop-deps.el
      - lisp/lispm-desktop-early.el
      - lisp/lispm-desktop-native-comp.el
      - lisp/lispm-desktop-packages.el
      - .github/workflows/install.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: LispM.app on ${{ matrix.os }}, Emacs ${{ matrix.emacs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
        emacs: ['31']
        # The experimental LispM, on Apple silicon only.
        include:
          - os: macos-latest
            emacs: '32'
    env:
      LISPM_HOME: ${{ github.workspace }}/../lispm
      LISPM_APP_DIR: ${{ github.workspace }}/../Applications
      LISPM_OPEN: '0'
      LISPM_EMACS: ${{ matrix.emacs }}
    steps:
      - uses: actions/checkout@v7
      # The installer keeps a checkout it finds on no branch as it is, so
      # the change under test is what LispM.app runs.
      - name: Check out the change as LispM's
        run: |
          mkdir -p "$LISPM_HOME"
          git clone -q "$GITHUB_WORKSPACE" "$LISPM_HOME/lispm-desktop"
          git -C "$LISPM_HOME/lispm-desktop" checkout -q --detach "$GITHUB_SHA"
      - name: Install
        shell: bash
        run: sh install.sh | tee "$RUNNER_TEMP/install.out"
      # Each package was shown as it installed, counted right: the lines
      # "    NAME (I/N)" number them one by one, out of the same N, to N.
      - name: Check the packages shown
        run: |
          grep -E '^    [^ ]+ \([0-9]+/[0-9]+\)$' "$RUNNER_TEMP/install.out" | tee "$RUNNER_TEMP/packages"
          awk -F '[(/)]' 'NR == 1 { n = $3 } $2 != NR || $3 != n { bad = 1; exit } END { exit bad || NR == 0 || NR != n }' \
            "$RUNNER_TEMP/packages"
      - name: Check LispM.app
        run: |
          app=$LISPM_APP_DIR/LispM.app
          codesign --verify --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = org.lispmachinelab.lispm
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = LispM
          # The launcher starts Emacs on the checkout, its packages installed
          # and native compilation working.
          "$app/Contents/MacOS/LispM" --batch --eval '
            (progn
              (unless (file-equal-p user-emacs-directory
                                    (expand-file-name "lispm-desktop" (getenv "LISPM_HOME")))
                (error "Not the checkout: %s" user-emacs-directory))
              (package-initialize)
              (dolist (package (quote (vertico consult magit exec-path-from-shell)))
                (unless (package-installed-p package)
                  (error "Not installed: %s" package)))
              (load (expand-file-name "lisp/lispm-desktop-early" user-emacs-directory) nil t)
              (require (quote comp))
              (native-compile (quote (lambda (x) (1+ x))))
              (unless (= emacs-major-version (string-to-number (getenv "LISPM_EMACS")))
                (error "Not Emacs %s: %s" (getenv "LISPM_EMACS") emacs-version))
              (princ (format "LispM runs %s on Emacs %s\n" user-emacs-directory emacs-version)))'
      - name: Show what failed
        if: failure()
        run: |
          sw_vers
          xcode-select -p
          grep -n -E 'error|rror:|clang|ld:' "$LISPM_HOME/install.log" | grep -v '^[0-9]*:  ' | head -n 40 || true

  linux:
    name: LispM on ${{ matrix.system }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        # The newest Debian and the oldest Ubuntu install.sh supports.
        system: ['debian:13', 'ubuntu:22.04']
    env:
      LISPM_HOME: ${{ github.workspace }}/../lispm
      LISPM_OPEN: '0'
    steps:
      # What a newcomer has: curl, to run install.sh with; git comes with
      # LispM's Emacs, but checking out the change takes it first.
      - name: Install curl and git
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q curl ca-certificates git
      - uses: actions/checkout@v7
      - name: Check out the change as LispM's
        run: |
          git config --global --add safe.directory '*'
          mkdir -p "$LISPM_HOME"
          git clone -q "$GITHUB_WORKSPACE" "$LISPM_HOME/lispm-desktop"
          git -C "$LISPM_HOME/lispm-desktop" checkout -q --detach "$GITHUB_SHA"
      - name: Install
        shell: bash
        run: set -o pipefail && sh install.sh | tee "$RUNNER_TEMP/install.out"
      - name: Check the packages shown
        run: |
          grep -E '^    [^ ]+ \([0-9]+/[0-9]+\)$' "$RUNNER_TEMP/install.out" | tee "$RUNNER_TEMP/packages"
          awk -F '[(/)]' 'NR == 1 { n = $3 } $2 != NR || $3 != n { bad = 1; exit } END { exit bad || NR == 0 || NR != n }' \
            "$RUNNER_TEMP/packages"
      - name: Check LispM
        run: |
          grep -q '^Exec="'"$HOME"'/.local/bin/lispm" %F$' "$HOME/.local/share/applications/lispm.desktop"
          test -s "$HOME/.local/share/icons/hicolor/512x512/apps/lispm.png"
          # The command starts LispM's Emacs on the checkout, its packages
          # installed, with xwidgets, and native compilation working.
          "$HOME/.local/bin/lispm" --batch --eval '
            (progn
              (unless (file-equal-p user-emacs-directory
                                    (expand-file-name "lispm-desktop" (getenv "LISPM_HOME")))
                (error "Not the checkout: %s" user-emacs-directory))
              (package-initialize)
              (dolist (package (quote (vertico consult magit)))
                (unless (package-installed-p package)
                  (error "Not installed: %s" package)))
              (unless (featurep (quote xwidget-internal)) (error "No xwidgets"))
              (require (quote comp))
              (native-compile (quote (lambda (x) (1+ x))))
              (princ (format "LispM runs %s on Emacs %s\n" user-emacs-directory emacs-version)))'
      - name: Show what failed
        if: failure()
        run: |
          cat /etc/os-release
          grep -n -E 'error|rror:|ld:' "$LISPM_HOME/install.log" | grep -v '^[0-9]*:  ' | head -n 40 || true
